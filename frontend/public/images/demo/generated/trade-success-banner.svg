      <g class="bg-confetti c15"><path d="M82 372 99 397 68 391z" fill="#FFB000"/><path class="fold" d="M83 375 85 391"/></g>
      <g class="bg-confetti c16"><path d="M278 348c8-7 18-4 21 6-8 7-18 5-21-6z" fill="#8B5CF6"/><path class="fold" d="M282 350c5 4 9 5 15 5"/></g>
      <g class="bg-confetti c17"><path d="M510 376 522 380 518 403 506 399z" fill="#FF7A59"/><path class="fold" d="M515 379 512 400"/></g>
      <g class="bg-confetti c18"><path d="M355 244 372 269 341 263z" fill="#56A8FF"/><path class="fold" d="M356 247 358 263"/></g>
    </g>

    <text x="360" y="100" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="39" font-weight="900" fill="#111111">交換が成立しました！</text>
    <text x="360" y="158" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#111111">おめでとうございます！</text>


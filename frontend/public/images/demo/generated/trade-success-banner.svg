<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="title desc">
  <title id="title">交換が成立しました！</title>
  <desc id="desc">青と黄緑のわたあめみたいなキャラクターが中央に横並びで交換成立をお祝いしているバナー</desc>
  <style>
    .card {
      animation: card-in 560ms cubic-bezier(.2, 1.25, .35, 1) both;
      transform-origin: 50% 50%;
    }

    .float {
      animation: yay-bounce 1700ms ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 88%;
    }

    .green-float {
      animation-delay: 260ms;
    }

    .blink {
      animation: blink 4600ms ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .pupil {
      animation: look 2800ms ease-in-out infinite;
    }

    .cracker {
      animation: cracker-pop 2200ms ease-out infinite;
      transform-box: fill-box;
      transform-origin: bottom center;
    }

    .burst-line {
      animation: burst-line 2200ms ease-out infinite;
      stroke-dasharray: 72;
      stroke-dashoffset: 72;
    }

    .burst-piece {
      animation: burst-piece 2200ms ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .fold {
      stroke: rgba(255, 255, 255, .58);
      stroke-width: 2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .burst-right {
      animation-delay: 150ms;
    }

    .bg-confetti {
      animation: bg-confetti-fall 5200ms ease-in-out infinite;
      opacity: .55;
      transform-box: fill-box;
      transform-origin: center;
    }

    .b1 { --dx: -118px; --dy: -104px; --rot: -44deg; }
    .b2 { --dx: -54px; --dy: -156px; --rot: 30deg; }
    .b3 { --dx: 48px; --dy: -150px; --rot: 62deg; }
    .b4 { --dx: 138px; --dy: -90px; --rot: 104deg; }
    .b5 { --dx: 10px; --dy: -184px; --rot: -68deg; }
    .b6 { --dx: -150px; --dy: -48px; --rot: -102deg; }
    .b7 { --dx: 158px; --dy: -34px; --rot: 130deg; }
    .b8 { --dx: 92px; --dy: -172px; --rot: -24deg; }
    .b9 { --dx: -92px; --dy: -148px; --rot: 76deg; }
    .b10 { --dx: 132px; --dy: -142px; --rot: -86deg; }
    .c1 { --fall-x: 16px; --fall-y: 42px; --spin: 42deg; }
    .c2 { --fall-x: -18px; --fall-y: 48px; --spin: -58deg; animation-delay: 420ms; }
    .c3 { --fall-x: 12px; --fall-y: 58px; --spin: 86deg; animation-delay: 820ms; }
    .c4 { --fall-x: -14px; --fall-y: 46px; --spin: -38deg; animation-delay: 1240ms; }
    .c5 { --fall-x: 20px; --fall-y: 54px; --spin: 72deg; animation-delay: 1640ms; }
    .c6 { --fall-x: -10px; --fall-y: 62px; --spin: -92deg; animation-delay: 2040ms; }
    .c7 { --fall-x: 14px; --fall-y: 45px; --spin: 56deg; animation-delay: 2440ms; }
    .c8 { --fall-x: -22px; --fall-y: 52px; --spin: -72deg; animation-delay: 2840ms; }
    .c9 { --fall-x: 18px; --fall-y: 56px; --spin: 108deg; animation-delay: 320ms; }
    .c10 { --fall-x: -16px; --fall-y: 64px; --spin: -116deg; animation-delay: 680ms; }
    .c11 { --fall-x: 22px; --fall-y: 50px; --spin: 84deg; animation-delay: 1040ms; }
    .c12 { --fall-x: -20px; --fall-y: 58px; --spin: -48deg; animation-delay: 1460ms; }
    .c13 { --fall-x: 12px; --fall-y: 70px; --spin: 132deg; animation-delay: 1880ms; }
    .c14 { --fall-x: -26px; --fall-y: 54px; --spin: -88deg; animation-delay: 2260ms; }
    .c15 { --fall-x: 20px; --fall-y: 60px; --spin: 62deg; animation-delay: 2660ms; }
    .c16 { --fall-x: -12px; --fall-y: 68px; --spin: -138deg; animation-delay: 3060ms; }
    .c17 { --fall-x: 24px; --fall-y: 48px; --spin: 96deg; animation-delay: 3480ms; }
    .c18 { --fall-x: -18px; --fall-y: 62px; --spin: -66deg; animation-delay: 3900ms; }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(12px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes yay-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      22% { transform: translateY(-18px) scale(1.035, .96); }
      38% { transform: translateY(3px) scale(.98, 1.035); }
      56% { transform: translateY(-10px) scale(1.02, .985); }
      72% { transform: translateY(0) scale(1); }
    }

    @keyframes blink {
      0%, 88%, 94%, 100% { transform: scaleY(1); }
      91% { transform: scaleY(.12); }
    }

    @keyframes look {
      0%, 100% { transform: translateX(0); }
      42% { transform: translateX(2px); }
      72% { transform: translateX(-1.5px); }
    }

    @keyframes cracker-pop {
      0%, 78%, 100% { transform: rotate(0deg) scale(1); }
      8% { transform: rotate(-8deg) scale(1.08); }
      16% { transform: rotate(6deg) scale(.98); }
      28% { transform: rotate(0deg) scale(1); }
    }

    @keyframes burst-line {
      0%, 8% {
        opacity: 0;
        stroke-dashoffset: 72;
      }
      16%, 36% {
        opacity: 1;
        stroke-dashoffset: 0;
      }
      58%, 100% {
        opacity: 0;
        stroke-dashoffset: -72;
      }
    }

    @keyframes burst-piece {
      0%, 8% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg) scale(.25);
      }
      16% {
        opacity: 1;
        transform: translate(calc(var(--dx) * .62), calc(var(--dy) * .62)) rotate(var(--rot)) scale(1.18);
      }
      52% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 1.02), calc(var(--dy) * .94 + 24px)) rotate(calc(var(--rot) + 96deg)) scale(1);
      }
      78%, 100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.28), calc(var(--dy) * .86 + 84px)) rotate(calc(var(--rot) + 188deg)) scale(.72);
      }
    }

    @keyframes bg-confetti-fall {
      0% {
        opacity: 0;
        transform: translate(0, -16px) rotate(0deg);
      }
      14%, 68% {
        opacity: .58;
      }
      100% {
        opacity: 0;
        transform: translate(var(--fall-x), var(--fall-y)) rotate(var(--spin));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .float,
      .blink,
      .pupil,
      .cracker,
      .burst-line,
      .burst-piece,
      .bg-confetti,
      .hand-party {
        animation: none;
      }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="20" y1="24" x2="700" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0BA"/>
      <stop offset=".52" stop-color="#FFFFD6"/>
      <stop offset="1" stop-color="#E6FFB5"/>
    </linearGradient>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#B7FF16" flood-opacity=".24"/>
    </filter>
  </defs>

